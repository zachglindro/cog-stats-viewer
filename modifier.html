<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Choice of Games Stats Modifier</title>
    <link rel="stylesheet" href="content/content.css" />
  </head>
  <body>
    <div
      id="cog-modifier-panel"
      style="
        width: 100%;
        height: 100vh;
        background: #f5f5f5;
        display: flex;
        flex-direction: column;
        font-family: inherit;
      "
    >
      <!-- Header -->
      <div
        style="
          padding: 10px;
          background: #e0e0e0;
          border-bottom: 1px solid #ccc;
          display: flex;
          justify-content: space-between;
          align-items: center;
        "
      >
        <h3 style="margin: 0">Stats Modifier</h3>
        <button id="move-to-panel-btn">Move to Panel</button>
      </div>

      <!-- Controls -->
      <div style="padding: 10px; border-bottom: 1px solid #ccc">
        <select id="scope-select">
          <option value="all">All Stats</option>
          <option value="permanent">Permanent</option>
          <option value="temporary">Temporary</option>
          <option value="recently">Recently Modified</option>
        </select>
        <select id="sort-select">
          <option value="name-asc">Name (A-Z)</option>
          <option value="name-desc">Name (Z-A)</option>
          <option value="modified-desc">Last Modified (newest)</option>
          <option value="modified-asc">Last Modified (oldest)</option>
        </select>
        <input
          id="search-input"
          type="text"
          placeholder="Search stats..."
          style="width: 100%; padding: 5px; margin-top: 5px"
        />
      </div>

      <!-- List container -->
      <div
        id="cog-stats-list"
        style="flex: 1; overflow-y: auto; padding: 10px"
      ></div>
    </div>

    <script src="modifier.js"></script>
  </body>
</html>
